<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容可信度核查 · M3</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f1420; color: #e6e9f0; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8b93a7; font-size: 13px; margin-bottom: 24px; }
  textarea { width: 100%; min-height: 110px; background: #171e2e; color: #e6e9f0; border: 1px solid #2a3348; border-radius: 8px; padding: 12px; font-size: 14px; resize: vertical; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  input[type=file] { color: #8b93a7; font-size: 13px; }
  button { background: #3b82f6; border: none; color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .timeline { margin-top: 28px; display: none; }
  .stage { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #1d2536; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a4358; flex: none; }
  .stage.running .dot { background: #f59e0b; animation: pulse 1s infinite; }
  .stage.done .dot { background: #22c55e; }
  .stage.skipped .dot { background: #64748b; }
  @keyframes pulse { 50% { opacity: .4; } }
  .detail { color: #8b93a7; font-size: 12px; margin-left: auto; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result { margin-top: 24px; background: #171e2e; border: 1px solid #2a3348; border-radius: 8px; padding: 16px; display: none; }
  .verdict { font-size: 18px; font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-all; color: #8b93a7; font-size: 12px; }
  .forensics { margin-top: 14px; padding: 12px; background: #131a29; border: 1px solid #2a3348; border-radius: 8px; }
  .forensics h3 { margin: 0 0 8px; font-size: 14px; }
  .forensics .field { font-size: 13px; margin: 6px 0; color: #c3c9d6; }
  .forensics .field b { color: #8b93a7; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 6px; }
  .badge.consistent { background: #14532d; color: #86efac; }
  .badge.inconsistent { background: #7f1d1d; color: #fca5a5; }
  .badge.uncertain { background: #334155; color: #cbd5e1; }
  .badge.degraded { background: #78350f; color: #fcd34d; }
  .claimline { font-size: 12px; color: #8b93a7; margin: 3px 0; }
  .img-preview { max-height: 200px; max-width: 100%; border-radius: 8px; border: 1px solid #2a3348; margin-top: 10px; display: none; cursor: zoom-in; }
  .fr-media { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin: 8px 0 10px; }
  .fr-thumb { max-height: 220px; max-width: 300px; border-radius: 8px; border: 1px solid #2a3348; cursor: zoom-in; flex: none; }
  .fr-fields { flex: 1 1 260px; min-width: 0; }
  .lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(6,10,18,.92); display: none;
    align-items: center; justify-content: center; padding: 28px; cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; border: 1px solid #2a3348;
    box-shadow: 0 24px 60px rgba(0,0,0,.6); }
  .lightbox .lb-cap { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center;
    color: #8b93a7; font-size: 12px; }
  .route { font-size: 12px; color: #f59e0b; margin-top: 4px; }
  select, input[type=number] { background: #171e2e; color: #e6e9f0; border: 1px solid #2a3348; border-radius: 6px; padding: 8px; font-size: 13px; }
  .review-note { font-size: 12px; color: #f59e0b; margin: 6px 0; }
  .graphbox { margin-top: 14px; padding: 12px; background: #131a29; border: 1px solid #2a3348; border-radius: 8px; }
  .graphbox h3 { margin: 0 0 8px; font-size: 14px; }
  #cy { height: 420px; background: #0f1420; border-radius: 6px; }
  .cy-tip { position: absolute; z-index: 30; max-width: 340px; padding: 7px 10px; background: #0b1220;
    border: 1px solid #3b82f6; border-radius: 6px; color: #e6e9f0; font-size: 12px; line-height: 1.6;
    pointer-events: none; display: none; box-shadow: 0 8px 20px rgba(0,0,0,.5); white-space: pre-wrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 12px; color: #8b93a7; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .legend span.off { opacity: .35; text-decoration: line-through; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .swatch.line { height: 3px; border-radius: 2px; }
  .gtoolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
  .gbtn { background: #1d2536; border: 1px solid #2a3348; color: #c3c9d6; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .gbtn:hover { border-color: #3b82f6; }
  .gbtn.active { background: #1e3a8a; border-color: #3b82f6; color: #fff; }
  .gdetail { margin-top: 8px; padding: 10px; background: #0f1420; border: 1px solid #2a3348; border-radius: 6px; font-size: 13px; display: none; }
  .gdetail h4 { margin: 0 0 6px; font-size: 13px; }
  .gdetail a { color: #3b82f6; }
  .gdetail .snippet { color: #8b93a7; font-size: 12px; margin: 6px 0; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: auto; }
  .gdetail .rel-line { margin: 4px 0; font-size: 12px; color: #c3c9d6; cursor: pointer; }
  .gdetail .rel-line:hover { color: #fff; }
  .badge.official, .badge.support { background: #14532d; color: #86efac; }
  .badge.mainstream { background: #3f6212; color: #bef264; }
  .badge.social { background: #78350f; color: #fcd34d; }
  .badge.unknown, .badge.same_source { background: #334155; color: #cbd5e1; }
  .badge.contradict { background: #7f1d1d; color: #fca5a5; }
  .badge.review { background: #1e3a8a; color: #bfdbfe; }
  .toggle-row { margin: 4px 0 10px; }
  .rsection { margin-top: 14px; padding: 12px; background: #131a29; border: 1px solid #2a3348; border-radius: 8px; }
  .rsection h3 { margin: 0 0 8px; font-size: 14px; }
  .rclaim { padding: 8px 0; border-bottom: 1px solid #1d2536; }
  .rclaim:last-child { border-bottom: none; }
  .rclaim-text { font-size: 13px; color: #e6e9f0; margin-bottom: 4px; }
  .evline { font-size: 12px; margin: 3px 0; color: #c3c9d6; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .evline a { color: #3b82f6; text-decoration: none; }
  .evline a:hover { text-decoration: underline; }
  .evline .w { color: #64748b; }
  .evnone { font-size: 12px; color: #64748b; }
  .rlabel { font-size: 12px; color: #8b93a7; margin: 6px 0 4px; }
  details { margin: 6px 0; }
  summary { cursor: pointer; font-size: 13px; color: #8b93a7; }
  summary:hover { color: #c3c9d6; }
  .argbody { font-size: 12px; color: #c3c9d6; white-space: pre-wrap; word-break: break-all; margin: 6px 0; max-height: 200px; overflow: auto; }
  .runinfo .kv { font-size: 12px; color: #c3c9d6; margin: 4px 0; }
  .runinfo .kv b { color: #8b93a7; font-weight: 600; }
  .demo-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .demo-label { font-size: 12px; color: #8b93a7; }
  .demo-note { margin-top: 8px; font-size: 12px; color: #f59e0b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>多模态内容可信度核查</h1>
  <div class="sub">M3 多模态流水线 · 断言拆解 → VLM 图文取证(OCR/一致性) → 证据检索 → 证据图 → 控辩裁多模型裁决 + 置信度路由 · <a href="/dashboard.html" style="color:#3b82f6">评测 Dashboard →</a></div>
  <form id="form">
    <textarea name="text" placeholder="粘贴待核查的帖子文本…" required></textarea>
    <div class="row">
      <input type="file" name="image" accept="image/*">
      <button id="submit" type="submit">开始核查</button>
    </div>
  </form>
  <div class="demo-bar">
    <span class="demo-label">演示</span>
    <button class="gbtn" type="button" id="demoLive1">用示例①实时跑（图文矛盾→虚假）</button>
    <button class="gbtn" type="button" id="demoLive2">用示例②实时跑（图文一致→可信）</button>
    <button class="gbtn" type="button" id="demoSnap1">载入示例①快照（离线）</button>
    <button class="gbtn" type="button" id="demoSnap2">载入示例②快照（离线）</button>
  </div>
  <div class="demo-note" id="demoHint"></div>
  <img id="preview" class="img-preview" alt="图像预览">
  <div class="lightbox" id="lightbox"><img alt="放大查看"><div class="lb-cap">点击任意处关闭 · Esc</div></div>
  <div class="timeline" id="timeline"></div>
  <div class="result" id="review"></div>
  <div class="result" id="result"></div>
</div>
<script src="/vendor/cytoscape.min.js"></script>
<script>
const STAGES = [
  ["decompose", "断言拆解"],
  ["forensics", "多模态取证"],
  ["retrieve", "证据检索"],
  ["graph", "证据图构建"],
  ["adjudicate", "多模型裁决"],
];
const form = document.getElementById("form");
const timeline = document.getElementById("timeline");
const resultBox = document.getElementById("result");
const reviewBox = document.getElementById("review");
const submitBtn = document.getElementById("submit");

const CONSISTENCY_LABELS = { consistent: "图文一致", inconsistent: "图文矛盾", uncertain: "无法判断" };

function renderForensics(fr, imgSrc) {
  const box = document.createElement("div");
  box.className = "forensics";
  const h = document.createElement("h3");
  h.textContent = "多模态取证";
  const badge = document.createElement("span");
  badge.className = `badge ${fr.overall || "uncertain"}`;
  badge.textContent = CONSISTENCY_LABELS[fr.overall] || fr.overall || "无法判断";
  h.append(badge);
  // 降级（限流/熔断）必须显式标红：降级≠通过，不能被当成"无矛盾"
  if (/降级|限流|不可用/.test(fr.notes || "")) {
    const db = document.createElement("span");
    db.className = "badge degraded";
    db.textContent = "取证降级";
    h.append(db);
  }
  box.append(h);

  const fields = document.createElement("div");
  fields.className = "fr-fields";
  const addField = (label, value) => {
    if (!value) return;
    const d = document.createElement("div");
    d.className = "field";
    const b = document.createElement("b");
    b.textContent = `${label}：`;
    d.append(b, document.createTextNode(value));
    fields.append(d);
  };
  addField("OCR 文字", fr.ocr_text);
  addField("图像描述", fr.description);
  addField("取证备注", fr.notes);
  if (imgSrc) {
    const media = document.createElement("div");
    media.className = "fr-media";
    const thumb = document.createElement("img");
    thumb.className = "fr-thumb";
    thumb.src = imgSrc;
    thumb.alt = "送检图像";
    thumb.title = "点击放大";
    thumb.addEventListener("click", () => openLightbox(imgSrc));
    media.append(thumb, fields);
    box.append(media);
  } else {
    box.append(fields);
  }
  for (const c of fr.consistency || []) {
    const line = document.createElement("div");
    line.className = "claimline";
    const cb = document.createElement("span");
    cb.className = `badge ${c.consistency || "uncertain"}`;
    cb.textContent = CONSISTENCY_LABELS[c.consistency] || c.consistency;
    line.append(document.createTextNode(`${c.claim_id} `), cb);
    if (c.note) line.append(document.createTextNode(` ${c.note}`));
    box.append(line);
  }
  return box;
}

const TIER_COLORS = { uploaded: "#38bdf8", official: "#22c55e", mainstream: "#84cc16", social: "#f59e0b", unknown: "#64748b" };
// 标签用同色系但更亮的版本，未知来源的灰在深底上偏暗
const TIER_TEXT_COLORS = { uploaded: "#7dd3fc", official: "#4ade80", mainstream: "#bef264", social: "#fbbf24", unknown: "#9aa6ba" };
const TIER_LABELS = { uploaded: "用户图像", official: "官方", mainstream: "主流媒体", social: "社交", unknown: "未知" };
const REL_COLORS = { support: "#22c55e", contradict: "#ef4444", same_source: "#64748b", neutral: "#3f4a63" };
const REL_LABELS = { support: "支持", contradict: "矛盾", same_source: "同源", neutral: "不相关/未判定" };

// 图上标签：文本交给 Cytoscape 自己换行（text-wrap + text-overflow-wrap:anywhere，
// 默认的 overflow-wrap 是 whitespace，中文长串不会断行，会横穿到隔壁列），
// 前端只负责按行数预估高度并截断超长文本。
const LABEL_FONT = 11;
const LABEL_MAX_W = 110;
const LABEL_MAX_LINES = 4;
const EM_PER_LINE = (LABEL_MAX_W / LABEL_FONT) * 0.95;
const LINE_H = LABEL_FONT * 1.25;
const WIDE_CHAR = /[\u1100-\u115F\u2E80-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFF60\uFFE0-\uFFE6]/;
const emLen = (s) => [...String(s == null ? "" : s)].reduce((a, ch) => a + (WIDE_CHAR.test(ch) ? 1 : 0.55), 0);
// 超出 4 行容量的部分截断并记省略号
const displayLabel = (s) => {
  const t = String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  const budget = LABEL_MAX_LINES * EM_PER_LINE;
  if (emLen(t) <= budget) return t;
  let out = "", acc = 0;
  for (const ch of t) {
    const w = WIDE_CHAR.test(ch) ? 1 : 0.55;
    if (acc + w > budget - 1) break;
    out += ch;
    acc += w;
  }
  return out + "…";
};
const lineCount = (s) => Math.max(1, Math.ceil(emLen(s) / EM_PER_LINE));
const nodeHeight = (n) => {
  // n 可能是普通对象（初始化时）也可能是 Cytoscape 元素（.data 是函数）
  const d = typeof n.data === "function" ? n.data() : (n.data || {});
  const lines = lineCount(displayLabel(d.label || d.id));
  // 节点圆半径 14 + 标签画在圆下方（圆底 + margin 6 + 行高）+ 上下留白
  return 36 + lines * LINE_H;
};
// 标签画在节点正下方（text-valign: bottom 在这里是"贴在圆底"），
// 圆心到占用区顶部的距离固定 14
const NODE_TOP = 14;
let cyTip = null;

function renderGraph(elements, evidenceChain) {
  if (!elements || !elements.nodes || !elements.nodes.length) return null;
  const box = document.createElement("div");
  box.className = "graphbox";
  const h = document.createElement("h3");
  h.textContent = "证据图（断言 ↔ 证据）· 悬停看完整标签，点击节点/边看详情，图例可过滤";
  const cyDiv = document.createElement("div");
  cyDiv.id = "cy";

  // 工具栏：适应画布 / 重新布局 / 高亮裁决证据链
  const toolbar = document.createElement("div");
  toolbar.className = "gtoolbar";
  const mkBtn = (label) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "gbtn"; b.textContent = label;
    toolbar.append(b);
    return b;
  };
  const fitBtn = mkBtn("适应画布");
  const colBtn = mkBtn("两列布局");
  const gridBtn = mkBtn("网格布局");
  const chain = (evidenceChain || [])
    .map((c) => (typeof c === "string" ? c : c && c.id))
    .filter(Boolean);
  const chainBtn = chain.length ? mkBtn(`高亮裁决证据链（${chain.length}）`) : null;

  // 图例 = 过滤器：关系三类 + 来源四级，点击切换显示
  const legend = document.createElement("div");
  legend.className = "legend";
  const active = {
    rels: new Set(Object.keys(REL_COLORS)),
    tiers: new Set(Object.keys(TIER_COLORS)),
  };
  const legendItem = (color, label, line, group, key) => {
    const s = document.createElement("span");
    const sw = document.createElement("i");
    sw.className = "swatch" + (line ? " line" : "");
    sw.style.background = color;
    s.append(sw, document.createTextNode(label));
    s.addEventListener("click", () => {
      const set = active[group];
      if (set.has(key)) { set.delete(key); s.classList.add("off"); }
      else { set.add(key); s.classList.remove("off"); }
      applyFilters();
    });
    legend.append(s);
  };
  legendItem("#3b82f6", "断言", false, "tiers", "__claim__");
  active.tiers.add("__claim__");
  for (const [k, label] of Object.entries(TIER_LABELS)) legendItem(TIER_COLORS[k], `证据·${label}`, false, "tiers", k);
  for (const [k, label] of Object.entries(REL_LABELS)) legendItem(REL_COLORS[k], label, true, "rels", k);

  const detail = document.createElement("div");
  detail.className = "gdetail";
  box.append(h, toolbar, cyDiv, legend, detail);

  let cy = null;
  let picked = null;
  let chainOn = false;

  const otherEnd = (e, n) => (e.source().same(n) ? e.target() : e.source());

  function applyFilters() {
    if (!cy) return;
    cy.edges().forEach((e) => {
      e.style("display", active.rels.has(e.data("relation")) ? "element" : "none");
    });
    cy.nodes().forEach((n) => {
      const ok = n.data("kind") === "claim"
        ? active.tiers.has("__claim__")
        : active.tiers.has(n.data("source_tier") || "unknown");
      n.style("display", ok ? "element" : "none");
    });
  }

  function clearPick() {
    picked = null;
    if (cy) cy.elements().removeClass("dimmed picked");
    detail.style.display = "none";
    detail.replaceChildren();
  }

  const badge = (cls, text) => {
    const b = document.createElement("span");
    b.className = `badge ${cls}`;
    b.textContent = text;
    return b;
  };
  const relLine = (label, rel, weight, onclick) => {
    const line = document.createElement("div");
    line.className = "rel-line";
    line.append(document.createTextNode(label + " "), badge(rel, REL_LABELS[rel] || rel));
    if (weight != null) line.append(document.createTextNode(` 权重 ${Number(weight).toFixed(2)}`));
    if (onclick) line.addEventListener("click", onclick);
    return line;
  };

  function showDetail(build) {
    detail.replaceChildren();
    build(detail);
    detail.style.display = "block";
  }

  function nodeDetail(n) {
    const d = n.data();
    showDetail((card) => {
      const t = document.createElement("h4");
      t.textContent = d.kind === "claim" ? `断言 ${d.id}` : `证据 ${d.id}`;
      card.append(t);
      if (d.kind === "evidence") {
        const meta = document.createElement("div");
        meta.append(badge(d.source_tier || "unknown", TIER_LABELS[d.source_tier] || "未知"));
        if (d.score != null) meta.append(document.createTextNode(` 检索分 ${Number(d.score).toFixed(2)}`));
        card.append(meta);
        if (/^https?:\/\//.test(d.url || "")) {
          const a = document.createElement("a");
          a.href = d.url; a.target = "_blank"; a.rel = "noopener noreferrer";
          a.textContent = "来源原文 ↗";
          const p = document.createElement("div");
          p.style.margin = "6px 0";
          p.append(a);
          card.append(p);
        }
        if (d.content) {
          const sn = document.createElement("div");
          sn.className = "snippet";
          sn.textContent = d.content.length > 300 ? d.content.slice(0, 300) + "…" : d.content;
          card.append(sn);
        }
        n.connectedEdges().forEach((e) => {
          const other = otherEnd(e, n);
          if (other.data("kind") !== "claim") return;
          card.append(relLine(other.data("label"), e.data("relation"), e.data("weight"), () => pickNode(other)));
        });
      } else {
        const txt = document.createElement("div");
        txt.textContent = d.label;
        card.append(txt);
        n.connectedEdges().forEach((e) => {
          const other = otherEnd(e, n);
          if (other.data("kind") !== "evidence") return;
          card.append(relLine(other.data("label"), e.data("relation"), e.data("weight"), () => pickNode(other)));
        });
      }
    });
  }

  function pickNode(n) {
    picked = n;
    cy.elements().removeClass("dimmed picked");
    const hood = n.closedNeighborhood();
    cy.elements().not(hood).addClass("dimmed");
    n.addClass("picked");
    nodeDetail(n);
  }

  function pickEdge(e) {
    picked = e;
    cy.elements().removeClass("dimmed picked");
    const ends = e.connectedNodes();
    cy.elements().not(ends.union(e)).addClass("dimmed");
    e.addClass("picked");
    showDetail((card) => {
      const t = document.createElement("h4");
      t.textContent = `关系：${REL_LABELS[e.data("relation")] || e.data("relation")}`;
      card.append(t);
      const meta = document.createElement("div");
      meta.textContent = `${e.source().data("label")} ↔ ${e.target().data("label")} · 权重 ${Number(e.data("weight") || 0).toFixed(2)}`;
      card.append(meta);
    });
  }

  // 容器须先入 DOM 且有尺寸，Cytoscape 才能正确布局
  requestAnimationFrame(() => {
    const raw = (elements.nodes || []).map((n) => {
      const d = n.data || {};
      return { kind: d.kind, data: { ...d, display: displayLabel(d.label || d.id) } };
    });

    // 断言 ↔ 证据是天然二分图，用两列布局代替力导向：左列断言、右列证据。
    // 标签完整换行显示，纵向间距按各节点实际行数累加，避免换行后互相叠压
    const claimList = raw.filter((n) => n.kind === "claim");
    const evList = raw.filter((n) => n.kind === "evidence");
    const GAP = 12;
    const PAD = 20;
    const colHeight = (list) => list.reduce((a, n) => a + nodeHeight(n) + GAP, 0);
    const H = Math.max(360, Math.ceil(Math.max(colHeight(claimList), colHeight(evList))));
    cyDiv.style.height = `${H}px`;
    const W = cyDiv.clientWidth || 680;
    const place = (list, x) => {
      let y = PAD;
      list.forEach((n) => {
        n.position = { x, y: y + NODE_TOP };
        y += nodeHeight(n) + GAP;
      });
    };
    place(claimList, W * 0.18);
    place(evList, W * 0.74);
    // preset 布局读的是元素顶层的 position，不能塞进 data
    const nodes = raw.map((n) => ({ data: n.data, position: n.position }));

    cy = cytoscape({
      container: cyDiv,
      elements: { nodes, edges: elements.edges || [] },
      style: [
        { selector: "node", style: {
          label: "data(display)", "text-wrap": "wrap", "text-max-width": LABEL_MAX_W,
          "text-overflow-wrap": "anywhere",
          "font-size": `${LABEL_FONT}px`, color: "#dbe1ec", "text-valign": "bottom", "text-halign": "center",
          "text-margin-y": 6, "line-height": 1.25,
          "text-background-color": "#0f1420", "text-background-opacity": 1,
          "text-background-padding": "2px", "text-background-shape": "roundrectangle",
          width: 28, height: 28, "border-width": 1, "border-color": "#2a3348",
        } },
        { selector: 'node[kind="claim"]', style: { shape: "ellipse", "background-color": "#3b82f6",
          color: "#bfdbfe" } },
        { selector: 'node[kind="evidence"]', style: { shape: "round-rectangle",
          "background-color": (ele) => TIER_COLORS[ele.data("source_tier")] || TIER_COLORS.unknown,
          color: (ele) => TIER_TEXT_COLORS[ele.data("source_tier")] || TIER_TEXT_COLORS.unknown } },
        { selector: "edge", style: { width: 1.5, "curve-style": "bezier", "line-color": "#64748b" } },
        { selector: 'edge[relation="support"]', style: {
          "line-color": REL_COLORS.support, width: (ele) => 1.5 + 3 * (ele.data("weight") || 0.5) } },
        { selector: 'edge[relation="contradict"]', style: {
          "line-color": REL_COLORS.contradict, width: (ele) => 1.5 + 3 * (ele.data("weight") || 0.5) } },
        { selector: 'edge[relation="same_source"]', style: { "line-color": REL_COLORS.same_source, "line-style": "dashed", opacity: 0.75 } },
        { selector: 'edge[relation="neutral"]', style: { "line-color": REL_COLORS.neutral, width: 1, opacity: 0.6 } },
        { selector: ".dimmed", style: { opacity: 0.12 } },
        { selector: ".picked", style: { "border-width": 3, "border-color": "#e6e9f0" } },
        { selector: ".chain", style: { "border-width": 3, "border-color": "#f59e0b" } },
      ],
      layout: { name: "preset" },
    });
    cy.fit(undefined, 30);
    cy.on("tap", "node", (evt) => pickNode(evt.target));
    cy.on("tap", "edge", (evt) => pickEdge(evt.target));
    cy.on("tap", (evt) => { if (evt.target === cy) clearPick(); });

    // 悬停显示完整标签（图上只有截断后的短名）
    if (cyTip) cyTip.remove();
    cyTip = document.createElement("div");
    cyTip.className = "cy-tip";
    document.body.append(cyTip);
    const tipText = (n) => {
      const d = n.data();
      const tier = d.kind === "evidence" ? `［${TIER_LABELS[d.source_tier] || "未知"}］` : "［断言］";
      return `${tier}${d.label || d.id}`;
    };
    cy.on("mouseover", "node", (evt) => {
      cyTip.textContent = tipText(evt.target);
      cyTip.style.display = "block";
    });
    cy.on("mouseout", "node", () => { cyTip.style.display = "none"; });
    cy.on("mousemove", (evt) => {
      if (cyTip.style.display === "none") return;
      const rect = cyDiv.getBoundingClientRect();
      const p = evt.renderedPosition;
      cyTip.style.left = `${rect.left + window.scrollX + p.x + 14}px`;
      cyTip.style.top = `${rect.top + window.scrollY + p.y + 14}px`;
    });
    applyFilters();
  });

  // 布局几何一律按“渲染像素”算：先把缩放复位到 1，
  // 否则 model 坐标 = 渲染像素 / zoom，来回切布局会越缩越小、内容反而铺出画布
  const resetViewport = () => {
    cy.zoom(1);
    cy.pan({ x: 0, y: 0 });
  };

  const applyColumns = () => {
    if (!cy) return;
    const GAP = 12;
    const PAD = 20;
    const claims = cy.nodes().filter((n) => n.data("kind") === "claim");
    const evs = cy.nodes().filter((n) => n.data("kind") === "evidence");
    const colHeight = (list) => list.reduce((a, n) => a + nodeHeight(n) + GAP, 0);
    // 画布先按两列所需高度调整（切布局时它可能被撑得更高/更矮）
    cyDiv.style.height = `${Math.max(360, Math.ceil(Math.max(colHeight(claims), colHeight(evs))))}px`;
    cy.resize();
    resetViewport();
    const W = cy.width();
    const place = (list, x) => {
      let y = PAD;
      list.forEach((n) => {
        n.position({ x, y: y + NODE_TOP });
        y += nodeHeight(n) + GAP;
      });
    };
    place(claims, W * 0.18);
    place(evs, W * 0.74);
    cy.fit(undefined, 30);
  };

  // 网格布局：按行铺开，行高取该行最高的节点，列宽不小于标签宽度，
  // 格子间距固定 —— 结构上就不可能叠字（力导向布局没有这个保证，已弃用）
  const applyGrid = () => {
    if (!cy) return;
    const nodes = cy.nodes().toArray();
    if (!nodes.length) return;
    const GAP = 16;
    const PAD = 20;
    const COLW = LABEL_MAX_W + 60;
    const cols = Math.max(1, Math.floor((cy.width() - 40) / COLW));
    const rows = [];
    for (let i = 0; i < nodes.length; i += cols) rows.push(nodes.slice(i, i + cols));
    const rowH = rows.map((r) => Math.max(...r.map((n) => nodeHeight(n))));
    const totalH = rowH.reduce((a, b) => a + b + GAP, 0);
    cyDiv.style.height = `${Math.max(360, Math.ceil(totalH + PAD * 2))}px`;
    cy.resize();
    resetViewport();
    const W = cy.width();
    const cellW = (W - 40) / cols;
    let y = PAD;
    rows.forEach((r, ri) => {
      r.forEach((n, ci) => n.position({ x: 20 + cellW * ci + cellW / 2, y: y + NODE_TOP }));
      y += rowH[ri] + GAP;
    });
    cy.fit(undefined, 30);
  };

  fitBtn.addEventListener("click", () => cy && cy.fit(undefined, 30));
  colBtn.addEventListener("click", () => applyColumns());
  gridBtn.addEventListener("click", () => applyGrid());
  if (chainBtn) {
    chainBtn.addEventListener("click", () => {
      if (!cy) return;
      chainOn = !chainOn;
      chainBtn.classList.toggle("active", chainOn);
      cy.elements().removeClass("chain dimmed picked");
      picked = null;
      detail.style.display = "none";
      if (!chainOn) return;
      const nodes = chain.map((id) => cy.getElementById(id)).filter((n) => n.nonempty());
      if (!nodes.length) return;
      const col = cy.collection(nodes);
      col.addClass("chain");
      cy.elements().not(col.closedNeighborhood()).addClass("dimmed");
      cy.animate({ fit: { eles: col, padding: 50 } }, { duration: 300 });
    });
  }
  return box;
}

function showReview(taskId, p) {
  reviewBox.replaceChildren();
  const h = document.createElement("div");
  h.className = "verdict";
  h.textContent = "待人工复核（HITL）";
  const meta = document.createElement("div");
  meta.className = "sub";
  meta.style.margin = "6px 0 4px";
  const conf = p.confidence == null ? "—" : Number(p.confidence).toFixed(2);
  meta.textContent = `模型初判：${p.verdict || ""}（置信度 ${conf}）· ${p.reason || ""}`;
  const note = document.createElement("div");
  note.className = "review-note";
  note.textContent = "证据不足或低置信，已暂停等待人工裁决；提交后流水线继续。";
  reviewBox.append(h, meta, note);
  for (const c of p.claims || p.review?.claims || []) {
    const d = document.createElement("div");
    d.className = "claimline";
    d.textContent = c;
    reviewBox.append(d);
  }
  const row = document.createElement("div");
  row.className = "row";
  const sel = document.createElement("select");
  for (const v of ["supported", "refuted", "misleading", "unverifiable"]) {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    if (v === p.verdict) o.selected = true;
    sel.append(o);
  }
  const confIn = document.createElement("input");
  confIn.type = "number"; confIn.step = "0.05"; confIn.min = "0"; confIn.max = "1";
  confIn.style.width = "90px"; confIn.placeholder = "置信度";
  confIn.value = p.confidence == null ? "" : p.confidence;
  const keep = document.createElement("button");
  keep.textContent = "维持原判";
  const override = document.createElement("button");
  override.textContent = "提交人工裁决";
  row.append(sel, confIn, keep, override);
  reviewBox.append(row);
  const send = async (decision) => {
    keep.disabled = override.disabled = true;
    note.textContent = "已提交人工裁决，流水线恢复中…";
    await fetch(`/api/verify/${taskId}/resume`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(decision),
    });
  };
  keep.onclick = () => send({});
  override.onclick = () => send({
    verdict: sel.value,
    confidence: confIn.value === "" ? null : Number(confIn.value),
    reason: "人工复核裁决",
  });
  reviewBox.style.display = "block";
}

function mkBadge(cls, text) {
  const b = document.createElement("span");
  b.className = `badge ${cls}`;
  b.textContent = text;
  return b;
}

function evLine(it, rel) {
  const line = document.createElement("div");
  line.className = "evline";
  if (rel) line.append(mkBadge(rel, REL_LABELS[rel] || rel));
  const tier = it.source_tier || "unknown";
  line.append(mkBadge(tier, TIER_LABELS[tier] || "未知"));
  if (/^https?:\/\//.test(it.url || "")) {
    const a = document.createElement("a");
    a.href = it.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = it.title || it.url;
    line.append(a);
  } else {
    const s = document.createElement("span");
    s.textContent = it.title || it.id || "";
    line.append(s);
  }
  if (it.weight != null) {
    const w = document.createElement("span");
    w.className = "w";
    w.textContent = `权重 ${Number(it.weight).toFixed(2)}`;
    line.append(w);
  }
  return line;
}

// 每条断言的中性边（未判定/不相关）数量：清单里只列支持/矛盾，
// 但图上会画出中性边，不给计数会显得"图上有线、清单为空"
function neutralCounts(p) {
  const map = {};
  for (const e of (p.graph_elements && p.graph_elements.edges) || []) {
    if (!e.data || e.data.relation !== "neutral") continue;
    map[e.data.source] = (map[e.data.source] || 0) + 1;
  }
  return map;
}

function renderReport(p) {
  const claimsSec = document.createElement("div");
  claimsSec.className = "rsection";
  const ch = document.createElement("h3");
  ch.textContent = "断言核查清单";
  claimsSec.append(ch);
  const neutrals = neutralCounts(p);
  if (p.graph_summary && p.graph_summary.length) {
    for (const s of p.graph_summary) {
      const card = document.createElement("div");
      card.className = "rclaim";
      const t = document.createElement("div");
      t.className = "rclaim-text";
      t.textContent = s.text;
      card.append(t);
      let any = false;
      for (const [rel, items] of [["support", s.support], ["contradict", s.contradict]]) {
        for (const it of items || []) { any = true; card.append(evLine(it, rel)); }
      }
      const nc = neutrals[s.claim_id] || 0;
      if (!any) {
        const none = document.createElement("div");
        none.className = "evnone";
        none.textContent = nc
          ? `暂无支持/矛盾证据（另有 ${nc} 条检索到的证据未判定/不相关）`
          : "暂无支持/矛盾证据";
        card.append(none);
      } else if (nc) {
        const note = document.createElement("div");
        note.className = "evnone";
        note.textContent = `另有 ${nc} 条检索到的证据未判定/不相关`;
        card.append(note);
      }
      claimsSec.append(card);
    }
  } else {
    for (const c of p.claims || []) {
      const d = document.createElement("div");
      d.className = "rclaim-text";
      d.textContent = c.text;
      claimsSec.append(d);
    }
  }

  const basisSec = document.createElement("div");
  basisSec.className = "rsection";
  const bh = document.createElement("h3");
  bh.textContent = "裁决依据";
  basisSec.append(bh);
  if ((p.evidence_chain || []).length) {
    const lab = document.createElement("div");
    lab.className = "rlabel";
    lab.textContent = "裁判引用的证据链";
    basisSec.append(lab);
    for (const it of p.evidence_chain) basisSec.append(evLine(it, null));
  }
  for (const [key, label] of [["prosecutor", "控方论证（点击展开）"], ["defender", "辩方论证（点击展开）"]]) {
    if (!p[key]) continue;
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = label;
    const body = document.createElement("div");
    body.className = "argbody";
    body.textContent = p[key];
    det.append(sum, body);
    basisSec.append(det);
  }

  const runinfo = document.createElement("details");
  runinfo.className = "rsection runinfo";
  const rs = document.createElement("summary");
  rs.textContent = "运行信息（模型 / 消耗 / 追踪）";
  runinfo.append(rs);
  const conf = p.confidence != null
    ? `${Number(p.confidence).toFixed(2)}（原始 ${p.confidence_raw != null ? Number(p.confidence_raw).toFixed(2) : "—"}）`
    : "—";
  const rows = [
    ["裁判模型", p.judge_model || "默认"],
    ["升级强裁判", p.escalated ? "是" : "否"],
    ["人工复核", p.human_review ? "是" : "否"],
    ["置信度", conf],
    ["Token 消耗", p.usage ? `${p.usage.total_tokens}（${p.usage.n_calls} 次调用，缓存命中 ${p.usage.cached}）` : "—"],
    ["追踪 ID", p.trace_id || "—"],
  ];
  for (const [k, val] of rows) {
    const d = document.createElement("div");
    d.className = "kv";
    const b = document.createElement("b");
    b.textContent = k + "：";
    d.append(b, document.createTextNode(val));
    runinfo.append(d);
  }
  return [claimsSec, basisSec, runinfo];
}

function showResult(title, payload) {
  reviewBox.style.display = "none";
  resultBox.replaceChildren();
  const v = document.createElement("div");
  v.className = "verdict";
  v.textContent = title;
  resultBox.append(v);
  const isObj = payload && typeof payload === "object";
  if (isObj && (payload.reason || payload.confidence != null)) {
    const meta = document.createElement("div");
    meta.className = "sub";
    meta.style.margin = "6px 0 10px";
    const conf = payload.confidence != null ? `置信度 ${Number(payload.confidence).toFixed(2)} · ` : "";
    meta.textContent = conf + (payload.reason || "");
    resultBox.append(meta);
  }
  if (isObj && payload.escalated) {
    const route = document.createElement("div");
    route.className = "route";
    route.textContent = `低置信度已升级强模型裁决：${payload.judge_model || ""}`;
    resultBox.append(route);
  }
  if (isObj && payload.human_review) {
    v.append(document.createTextNode(" "), mkBadge("review", "人工复核"));
  }
  if (isObj) {
    const human = document.createElement("div");
    const [claimsSec, basisSec, runinfo] = renderReport(payload);
    human.append(claimsSec, basisSec);
    if (payload.forensics) {
      const src = preview.style.display === "block" && preview.src ? preview.src : null;
      human.append(renderForensics(payload.forensics, src));
    }
    if (payload.graph_elements) {
      const gb = renderGraph(payload.graph_elements, payload.evidence_chain);
      if (gb) human.append(gb);
    }
    human.append(runinfo);
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(payload, null, 2);
    pre.style.display = "none";
    const toggleRow = document.createElement("div");
    toggleRow.className = "toggle-row";
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "gbtn";
    toggle.textContent = "查看原始 JSON";
    let raw = false;
    toggle.addEventListener("click", () => {
      raw = !raw;
      human.style.display = raw ? "none" : "block";
      pre.style.display = raw ? "block" : "none";
      toggle.textContent = raw ? "返回报告视图" : "查看原始 JSON";
    });
    toggleRow.append(toggle);
    resultBox.append(toggleRow, human, pre);
  } else {
    const pre = document.createElement("pre");
    pre.textContent = String(payload);
    resultBox.append(pre);
  }
  resultBox.style.display = "block";
  submitBtn.disabled = false;
}

}

  lightbox.style.display = "none";
}

  const file = fileInput.files[0];

    setPreview(file);

    previewUrl = null;
    preview.removeAttribute("src");
    preview.style.display = "none";
  }
});

// 演示用：把示例图片塞进 file input（浏览器不允许直接设 value，只能走 DataTransfer）
let previewUrl = null;
function setPreview(blob) {
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(blob);
  preview.src = previewUrl;
  preview.style.display = "block";
}
async function attachImage(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`示例图片缺失（${res.status}）`);
  const blob = await res.blob();
  const file = new File([blob], url.split("/").pop(), { type: blob.type });
  const dt = new DataTransfer();
  dt.items.add(file);
  fileInput.files = dt.files;
  setPreview(file);
}

    dot.className = "dot";
    const name = document.createElement("span");
    name.textContent = label;
    const detail = document.createElement("span");
    detail.className = "detail";
    row.append(dot, name, detail);
    timeline.appendChild(row);
  }
  try {
    const res = await fetch("/api/verify", { method: "POST", body: new FormData(form) });
    if (!res.ok) throw new Error(await res.text());
    const { task_id } = await res.json();
    const es = new EventSource(`/api/verify/${task_id}/events`);
    es.addEventListener("stage", (ev) => {
      const d = JSON.parse(ev.data);
      const el = document.getElementById(`stage-${d.stage}`);
      el.classList.remove("running", "done");
      el.classList.add(d.status);
      if (d.detail) el.querySelector(".detail").textContent = JSON.stringify(d.detail);
    });
    es.addEventListener("review", (ev) => {
      showReview(task_id, JSON.parse(ev.data));
    });
    es.addEventListener("result", (ev) => {
      const d = JSON.parse(ev.data);
      showResult(`结论：${d.verdict_label || d.verdict}`, d);
      es.close();
    });
    es.addEventListener("fail", (ev) => {
      showResult("任务失败", ev.data);
      es.close();
    });
  } catch (err) {
    showResult("请求失败", err.message);
  }
});
</script>
</body>
</html>
