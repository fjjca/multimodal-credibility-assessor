# 一键起：先 cp .env.example .env 并填 key，然后 docker compose up --build
# 访问 http://localhost:8000
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # 容器内须绑 0.0.0.0 才能被端口映射访问（覆盖 .env 里的 127.0.0.1）
      HOST: 0.0.0.0
    volumes:
      - ./.cache:/app/.cache
      - ./.data:/app/.data
    restart: unless-stopped